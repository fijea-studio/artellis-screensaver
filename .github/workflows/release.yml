# Builds a signed APK whenever a version tag (v1.0.1, v1.1.0, ...) is pushed, and attaches it to a draft
# GitHub Release. Review the draft on the Releases page, then publish it.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -i artellis-release.jks | pbcopy)
#   KEYSTORE_PASSWORD  the keystore password
#   KEY_PASSWORD       the key password (usually the same)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check the tag matches versionName
        run: |
          tag=${GITHUB_REF_NAME#v}
          name=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          if [ "$tag" != "$name" ]; then
            echo "::error::Tag v$tag doesn't match versionName '$name' in app/build.gradle"
            exit 1
          fi

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=artellis\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "artellis-${GITHUB_REF_NAME#v}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Artellis ${{ github.ref_name }}
          files: artellis-*.apk
          generate_release_notes: true

      - name: Remove signing files
        if: always()
        run: rm -f release.jks keystore.properties
